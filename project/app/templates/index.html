{% extends "layout.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-blue-50 flex items-center justify-center py-12 px-4 transition-colors duration-300">
    <div class="max-w-md w-full space-y-8">
        <!-- Logo -->
        <div class="text-center">
            <div class="mx-auto mb-6 flex items-center justify-center">
                <!-- Medical Cross with DNA -->
                <div class="relative mr-4">
                    <div class="h-16 w-24 bg-blue-900 rounded-lg flex items-center justify-center">
                        <div class="text-white text-3xl font-bold">+</div>
                    </div>
                    <!-- DNA Helix overlay -->
                    <div class="absolute -right-2 top-0 h-16 w-12">
                        <svg viewBox="0 0 48 64" class="h-full w-full">
                            <path d="M4 8 Q16 4 28 8 Q40 12 52 8" stroke="#10b981" stroke-width="3" fill="none"/>
                            <path d="M4 24 Q16 28 28 24 Q40 20 52 24" stroke="#10b981" stroke-width="3" fill="none"/>
                            <path d="M4 40 Q16 36 28 40 Q40 44 52 40" stroke="#10b981" stroke-width="3" fill="none"/>
                            <path d="M4 56 Q16 60 28 56 Q40 52 52 56" stroke="#10b981" stroke-width="3" fill="none"/>
                            <line x1="16" y1="12" x2="16" y2="20" stroke="#6b7280" stroke-width="2"/>
                            <line x1="40" y1="16" x2="40" y2="24" stroke="#6b7280" stroke-width="2"/>
                            <line x1="16" y1="44" x2="16" y2="52" stroke="#6b7280" stroke-width="2"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <h1 class="text-5xl font-bold">
                        <span class="text-blue-900">MED</span>
                        <span class="text-green-500 font-light">gen</span>
                    </h1>
                    <p class="text-gray-500 text-lg mt-2">AI Telemedicine Platform</p>
                </div>
            </div>
            <p class="text-gray-600 mt-4">Connect with healthcare professionals instantly</p>
        </div>

        <!-- Login Form -->
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 relative">
            <!-- Language and Dark Mode Toggle -->
            <div class="absolute top-4 right-4 flex items-center space-x-2">
                <!-- Language Toggle -->
                <div class="relative">
                    <button id="formLanguageToggle" class="flex items-center space-x-2 text-gray-500 hover:text-gray-700 px-2 py-1 rounded-md transition-colors">
                        <i class="fas fa-globe text-sm"></i>
                        <span id="formCurrentLang" class="text-sm">EN</span>
                        <i class="fas fa-chevron-down text-xs"></i>
                    </button>
                    <div id="formLanguageDropdown" class="absolute right-0 mt-1 w-32 bg-white rounded-md shadow-lg z-50 hidden border border-gray-200">
                        <div class="py-1">
                            <button class="form-lang-option block w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100" data-lang="en">
                                <i class="fas fa-flag mr-2 text-xs"></i>English
                            </button>
                            <button class="form-lang-option block w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100" data-lang="hi">
                                <i class="fas fa-flag mr-2 text-xs"></i>हिंदी
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <h2 class="text-xl font-semibold text-gray-900 mb-6 pr-20" data-translate="welcome">Welcome Back</h2>
            
            <form id="loginForm" class="space-y-4">
                <!-- Role Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" data-translate="select_role">Select Role</label>
                    <select id="role" name="role" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="patient" data-translate="patient">Patient</option>
                        <option value="doctor" data-translate="doctor">Doctor</option>
                        <option value="admin" data-translate="admin">Admin</option>
                    </select>
                </div>

                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" data-translate="user_id">User ID</label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" data-translate="password">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-indigo-700 transition-colors"
                        data-translate="sign_in">
                    Sign In
                </button>
            </form>

            <!-- Demo Access -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-sm text-gray-600 mb-3" data-translate="quick_demo_access">Quick Demo Access:</p>
                <div class="flex space-x-3">
                    <a href="{{ url_for('auth.demo_login', role='patient') }}" 
                       class="flex-1 bg-gray-100 text-gray-700 py-2 px-4 rounded-lg text-center hover:bg-gray-200 transition-colors text-sm font-medium"
                       data-translate="demo_patient">
                        Demo Patient
                    </a>
                    <a href="{{ url_for('auth.demo_login', role='doctor') }}" 
                       class="flex-1 bg-gray-100 text-gray-700 py-2 px-4 rounded-lg text-center hover:bg-gray-200 transition-colors text-sm font-medium"
                       data-translate="demo_doctor">
                        Demo Doctor
                    </a>
                    <a href="{{ url_for('auth.demo_login', role='admin') }}" 
                       class="flex-1 bg-gray-100 text-gray-700 py-2 px-4 rounded-lg text-center hover:bg-gray-200 transition-colors text-sm font-medium"
                       data-translate="demo_admin">
                        Demo Admin
                    </a>
                </div>
            </div>
        </div>

        <!-- Language Selection -->
        <div class="text-center">
            <div class="inline-flex items-center text-sm text-gray-500">
                <i class="fas fa-globe mr-2"></i>
                <span>EN</span>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = Object.fromEntries(formData);
    
    try {
        const response = await fetch('{{ url_for("auth.login") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            window.location.href = result.redirect;
        } else {
            alert(result.error || 'Login failed');
        }
    } catch (error) {
        alert('Login failed: ' + error.message);
    }
});

// Auto-fill demo credentials when role changes
document.getElementById('role').addEventListener('change', function() {
    const role = this.value;
    const credentials = {
        'patient': { username: 'patient', password: 'patient123' },
        'doctor': { username: 'doctor', password: 'doctor123' },
        'admin': { username: 'admin', password: 'admin123' }
    };
    
    if (credentials[role]) {
        document.getElementById('username').value = credentials[role].username;
        document.getElementById('password').value = credentials[role].password;
    }
});

// Auto-fill initial values
document.getElementById('role').dispatchEvent(new Event('change'));

// Language Toggle Functionality
document.addEventListener('DOMContentLoaded', function() {
    // Form Language Toggle Functionality
    const formLanguageToggle = document.getElementById('formLanguageToggle');
    const formLanguageDropdown = document.getElementById('formLanguageDropdown');
    const formCurrentLang = document.getElementById('formCurrentLang');
    const formLangOptions = document.querySelectorAll('.form-lang-option');

    if (formLanguageToggle && formLanguageDropdown) {
        // Toggle dropdown
        formLanguageToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            formLanguageDropdown.classList.toggle('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!formLanguageToggle.contains(e.target) && !formLanguageDropdown.contains(e.target)) {
                formLanguageDropdown.classList.add('hidden');
            }
        });

        // Handle language selection
        formLangOptions.forEach(option => {
            option.addEventListener('click', function(e) {
                e.preventDefault();
                const selectedLang = this.getAttribute('data-lang');
                
                // Update current language display
                formCurrentLang.textContent = selectedLang.toUpperCase();
                
                // Close dropdown
                formLanguageDropdown.classList.add('hidden');
                
                // Change language using translation manager
                if (window.translationManager) {
                    window.translationManager.changeLanguage(selectedLang);
                } else {
                    console.log('Translation manager not available, selected language:', selectedLang);
                    // Store selected language for when translation manager loads
                    localStorage.setItem('selectedLanguage', selectedLang);
                }
            });
        });

        // Initialize current language display
        const savedLanguage = localStorage.getItem('selectedLanguage') || 'en';
        formCurrentLang.textContent = savedLanguage.toUpperCase();
        
        // Wait for translation manager to load
        setTimeout(() => {
            if (window.translationManager) {
                const currentLang = window.translationManager.getCurrentLanguage();
                formCurrentLang.textContent = currentLang.toUpperCase();
                
                // Apply saved language if different from current
                if (savedLanguage !== currentLang) {
                    window.translationManager.changeLanguage(savedLanguage);
                }
            }
        }, 100);
    }
});
</script>
{% endblock %}
