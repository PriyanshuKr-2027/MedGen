<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #f5f5f5;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
        }
        .language-toggle { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            background: white; 
            padding: 10px; 
            border-radius: 5px; 
            border: 1px solid #ddd;
            cursor: pointer;
        }
        .dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none;
            min-width: 120px;
        }
        .dropdown button {
            display: block;
            width: 100%;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            text-align: left;
        }
        .dropdown button:hover {
            background: #f0f0f0;
        }
        h1 { color: #333; }
        .test-item { 
            margin: 10px 0; 
            padding: 10px; 
            background: #f9f9f9; 
            border-radius: 5px; 
        }
    </style>
</head>
<body>
    <div class="language-toggle">
        <div style="position: relative;">
            <button id="toggleBtn">
                🌍 <span id="currentLang">EN</span> ▼
            </button>
            <div id="dropdown" class="dropdown">
                <button onclick="setLanguage('en')">🇺🇸 English</button>
                <button onclick="setLanguage('hi')">🇮🇳 हिंदी</button>
            </div>
        </div>
    </div>

    <div class="container">
        <h1 data-translate="welcome">Welcome</h1>
        
        <div class="test-item">
            <strong data-translate="patient_dashboard">Patient Dashboard</strong>
        </div>
        
        <div class="test-item">
            <strong data-translate="doctor_dashboard">Doctor Dashboard</strong>
        </div>
        
        <div class="test-item">
            <strong data-translate="symptom_analysis">AI Symptom Analysis</strong>
        </div>
        
        <div class="test-item">
            <button data-translate="start_reporting">Start Reporting</button>
        </div>
        
        <div class="test-item">
            <button data-translate="connect_now">Connect Now</button>
        </div>
        
        <div class="test-item">
            <span data-translate="listening">Listening...</span>
        </div>
        
        <div class="test-item">
            <input type="text" placeholder="Type your symptoms here..." data-translate-placeholder="type_symptoms">
        </div>
    </div>

    <script src="translation.js"></script>
    <script>
        // Simple toggle functionality for testing
        document.getElementById('toggleBtn').onclick = function() {
            const dropdown = document.getElementById('dropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        };
        
        function setLanguage(lang) {
            if (window.translationManager) {
                window.translationManager.setLanguage(lang);
            }
            document.getElementById('dropdown').style.display = 'none';
        }
        
        // Close dropdown when clicking outside
        document.onclick = function(e) {
            if (!e.target.closest('.language-toggle')) {
                document.getElementById('dropdown').style.display = 'none';
            }
        };
    </script>
</body>
</html>
